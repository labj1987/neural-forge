[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/layer",
    "crates/helper",
    "crates/supervisor",
    "crates/gui",
    "crates/cli",
]
# `helper` targets x86_64-pc-windows-gnu only and is built explicitly
# (`cargo build --target x86_64-pc-windows-gnu -p neural-forge-helper`), never as
# part of a plain `cargo build --workspace` on the host.
default-members = [
    "crates/protocol",
    "crates/layer",
    "crates/supervisor",
    "crates/gui",
    "crates/cli",
]

[workspace.package]
version = "0.1.85"
edition = "2021"
authors = ["Linnard Alex Brown Jr."]
license = "AGPL-3.0-or-later"

# Workspace-wide because Cargo profiles (other than a few per-package-overridable
# knobs, and `panic` isn't one of them) apply to the whole build, not one member.
# `neural-forge-layer` is a cdylib the Vulkan loader calls back into across a plain C ABI
# boundary (vkGetInstanceProcAddr and friends) -- an unwinding panic crossing that
# boundary is undefined behavior, not a clean error, so it needs `abort`. Every other
# crate in the workspace is fine with `abort` too (no code here relies on
# catch_unwind), so there's no reason to fight this into a per-crate setting.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Ships in the AppImage; the extra link time only costs a `build-appimage.sh` run, not
# any iteration loop. `strip = true` doesn't lose anything a release build needs (this
# project debugs from `NEURAL_FORGE_LOG`, not a debugger against a shipped binary), and
# `libneural_forge_layer.so`'s own size matters more than most since it's a real DLL
# Steam maps into every targeted game process. See CHANGELOG.md/docs/HARDWARE_VALIDATION.md
# for the measured size and confirmation this didn't regress any hot-path timing.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
