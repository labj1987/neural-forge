# `cargo fmt --all` (CI checks it). The code is written wide: 160 columns, and the small-construct widths
# (calls, struct literals, chains) allowed up to the full width instead of rustfmt's narrower defaults.
# third_party/vk-layer-for-rust keeps its own rustfmt.toml (100 columns, upstream's).
max_width = 160
use_small_heuristics = "Max"
