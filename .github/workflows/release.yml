name: Build and Release

on:
  push:
    tags:
      - 'v*'

# Nothing here can write to the repository except the `publish` job, which only downloads the
# build job's files and attaches them to the release. The build (check.yml: the same build and
# checks every push gets) runs the whole toolchain (cargo, build scripts, apt packages) with a
# read-only token and no stored git credentials, so a compromised dependency has nothing to publish
# with. Every action is pinned to a full commit SHA: a tag such as `v3` can be moved to other code,
# a SHA cannot. The trailing comment names the release the SHA is; Dependabot proposes the updates.
permissions:
  contents: read

# One release at a time, never cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/check.yml
    with:
      release: true

  # The only job with write access, and it runs no project code: it attaches what `build` made.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            neural-forge-*-x86_64.AppImage
            neural-forge-*-x86_64.AppImage.zsync
          fail_on_unmatched_files: true
          body_path: release-notes.md
