name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # A test build of a fix branch for the person who reported the issue (AGENTS.md, "Test builds"):
  # the same build, published as a pre-release, never as the latest release.
  workflow_dispatch:
    inputs:
      issue:
        description: The issue number this test build is for
        required: true
        type: number

# Nothing here can write to the repository except the `publish` job, which only downloads the
# build job's files and attaches them to the release. The build (check.yml: the same build and
# checks every push gets) runs the whole toolchain (cargo, build scripts, apt packages) with a
# read-only token and no stored git credentials, so a compromised dependency has nothing to publish
# with. Every action is pinned to a full commit SHA: a tag such as `v3` can be moved to other code,
# a SHA cannot. The trailing comment names the release the SHA is; the weekly maintenance round updates them.
permissions:
  contents: read

# One release at a time, never cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/check.yml
    with:
      release: true

  # The only job with write access, and it runs no project code: it attaches what `build` made.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            neural-forge-*-x86_64.AppImage
            neural-forge-*-x86_64.AppImage.zsync
          fail_on_unmatched_files: true
          body_path: release-notes.md

      - name: Create the test build (a pre-release)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: test-${{ github.ref_name }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Test build for #${{ inputs.issue }} (${{ github.ref_name }})"
          prerelease: true
          make_latest: false
          files: |
            neural-forge-*-x86_64.AppImage
            neural-forge-*-x86_64.AppImage.zsync
          fail_on_unmatched_files: true
          body: |
            **Not a release.** A test build of the branch `${{ github.ref_name }}` (commit ${{ github.sha }}) for issue #${{ inputs.issue }}, so the fix can be tried before it is released. Install it like a release; please say in the issue whether it fixes the problem. Once the fix is released, update to that release; this test build is then deleted. The version number is the one the fix will be released as.
