name: Proton script check

# Weekly: does Neural Forge's patch of Proton's `proton` script still apply to the newest upstream scripts
# (Valve's Proton Experimental, proton-cachyos)? The patch anchors on the `NVIDIA_WINE_DLL_DIR` block and is
# refused unless it is there exactly once; Valve's script has a TODO to replace that block with an NGXCore\NGXPath
# registry key, and when it lands no copy can be made from that Proton until the anchor moves
# (scripts/check_proton_scripts.py, docs/PROTON_NGX.md).
#
# The answer lives in one standing issue (label proton-script-check), as in pin-check.yml, so this sends as few
# notifications as possible: it is opened the first time the patch stops applying and reopened (never a second
# issue) when it breaks again, its body is edited in place (an edit notifies nobody) only when the report changed,
# and it is closed once the patch applies again. Never a comment. A failed scheduled run emails, so a run that
# cannot reach upstream does not fail: it says so in its summary and leaves the issue alone.
#
# A run on any other branch than the default one (workflow_dispatch, to test this workflow) only prints what it
# would do to the issue.
on:
  schedule:
    - cron: "41 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proton-script-check-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ON_DEFAULT_BRANCH: ${{ github.event_name == 'schedule' || (github.event.repository.default_branch != '' && github.ref_name == github.event.repository.default_branch) }}

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain from rust-toolchain.toml
        id: toolchain
        run: |
          channel="$(sed -n 's/^channel = "\([0-9][0-9.]*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Patch the newest upstream scripts
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          state=unknown
          for attempt in 1 2 3; do
            set +e
            python3 scripts/check_proton_scripts.py > report.md
            status=$?
            set -e
            case $status in
              0) state=current; break ;;
              10) state=broken; break ;;
              *) echo "attempt $attempt: could not check" >&2; sleep 60 ;;
            esac
          done
          cat report.md
          if [ "$state" = unknown ]; then
            echo "Upstream's scripts could not be checked three times; the issue is left as it is." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Keep the standing issue up to date
        if: steps.check.outputs.state != 'unknown'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.check.outputs.state }}
          TITLE: "Proton script patch no longer applies"
        run: |
          DRY_RUN=true
          [ "$ON_DEFAULT_BRANCH" != true ] || DRY_RUN=false
          repo="$GITHUB_REPOSITORY"
          act() {
            if [ "$DRY_RUN" = true ]; then
              echo "would run: gh $*" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              gh "$@"
            fi
          }
          if [ "$DRY_RUN" = true ]; then
            { echo "Test run on $GITHUB_REF_NAME: the issue is left alone. Its body would be:"; echo; cat report.md; echo; } >> "$GITHUB_STEP_SUMMARY"
          fi
          act label create proton-script-check --repo "$repo" --color c5def5 --description "The weekly Proton script check's standing issue" 2>/dev/null || true
          found="$(gh issue list --repo "$repo" --state all --label proton-script-check --limit 1 \
            --json number,state --jq '.[0] | "\(.number // "") \(.state // "")"')"
          read -r number state <<<"$found"
          if [ "$STATE" = broken ]; then
            if [ -z "$number" ]; then
              act issue create --repo "$repo" --title "$TITLE" --label proton-script-check --body-file report.md
              exit 0
            fi
            if [ "$(gh issue view "$number" --repo "$repo" --json body --jq .body)" != "$(cat report.md)" ]; then
              act issue edit "$number" --repo "$repo" --body-file report.md
            fi
            if [ "$state" = CLOSED ]; then
              act issue reopen "$number" --repo "$repo"
            fi
          elif [ -n "$number" ] && [ "$state" = OPEN ]; then
            act issue edit "$number" --repo "$repo" --body-file report.md
            act issue close "$number" --repo "$repo"
          else
            echo "the patch applies to every script"
          fi
