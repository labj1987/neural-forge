name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# An explicit `shell: bash` runs every step with `-eo pipefail`, so a failing `cargo test`
# piped through `tee` still fails the step.
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # A GPU test that finds no Vulkan device panics instead of skipping, so a broken
      # lavapipe install fails CI instead of passing it with nothing run.
      NEURAL_FORGE_REQUIRE_VULKAN: "1"
    steps:
      - uses: actions/checkout@v7

      # Same package list build-appimage.sh installs on a from-scratch image --
      # libgtk-4-dev/libadwaita-1-dev for the gui crate (glib-sys and friends need the
      # real system libraries via pkg-config, not just a Rust toolchain), mingw for the
      # Windows-only helper crate, and a software Vulkan ICD (lavapipe), 64- and 32-bit,
      # so neural-forge-layer's real-device tests run in both the native and the i686
      # test steps. NEURAL_FORGE_REQUIRE_VULKAN above makes that an assertion, not a hope.
      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 gcc-multilib \
            libvulkan1 mesa-vulkan-drivers vulkan-tools \
            libvulkan1:i386 mesa-vulkan-drivers:i386

      # Only lavapipe, never whatever other ICD the runner image happens to carry. The
      # loader skips the manifest whose bitness does not match the test binary.
      - name: Select the lavapipe Vulkan driver
        run: |
          icds="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | paste -sd:)"
          test -n "$icds"
          echo "VK_DRIVER_FILES=$icds" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$icds"

      - name: Install Rust
        run: rustup target add x86_64-pc-windows-gnu i686-unknown-linux-gnu

      - name: Configure the mingw linker
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          ar = "x86_64-w64-mingw32-ar"
          EOF

      # Plain `cargo test`/`cargo check` respect the workspace's `default-members`
      # (see root Cargo.toml), which deliberately excludes `neural-forge-helper` -- a
      # Windows-only crate that must never be built for the host. See the project's
      # CLAUDE.md "Workspace layout" section for why `--workspace`/`--all` must not be
      # used here.
      - name: cargo test (native crates)
        run: |
          cargo test 2>&1 | tee test-native.log
          ran="$(grep -c '\[neural-forge-gpu-test\] device acquired' test-native.log || true)"
          echo "GPU tests that ran (native): $ran" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$ran" -gt 0

      - name: cargo check (helper, cross-compiled)
        run: cargo check --target x86_64-pc-windows-gnu -p neural-forge-helper

      - name: 32-bit layer tests
        run: |
          cargo test --target i686-unknown-linux-gnu -p neural-forge-layer 2>&1 | tee test-i686.log
          ran="$(grep -c '\[neural-forge-gpu-test\] device acquired' test-i686.log || true)"
          echo "GPU tests that ran (i686): $ran" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$ran" -gt 0

      # scripts/install.py delegates install/uninstall to neural-forge-cli (the single
      # implementation), so this exercises the same code the GUI's Setup tab runs.
      - name: Build the CLI for the installation tests
        run: cargo build -p neural-forge-cli

      - name: Installation coexistence tests
        run: python3 scripts/test_install.py

      - name: Shader sources match committed SPIR-V
        run: python3 scripts/check_shaders.py

      - name: AppStream releases match the changelog
        run: python3 scripts/sync_appdata_releases.py --check

      - name: Vulkan loader smoke test
        run: bash scripts/smoke-test.sh

      - name: Namespace contract
        run: python3 scripts/check_namespace.py
