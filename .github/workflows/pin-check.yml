name: Pin check

# Weekly: are the pins Dependabot cannot see (the native toolchain, cargo-deny, appimagetool, the
# AppImage runtime, the Rust toolchain) behind upstream? Every pin that is behind is bumped by
# scripts/check_pins.py --bump on the branch pin-bump, the full build and check (check.yml, what every
# change and release gets) runs on that commit, and only when it passes is the branch the run started
# from (main, for the schedule) fast-forwarded to it. A bump commit is pins only: no version, no release;
# the next release carries it.
#
# The answer lives in one standing issue (label pin-check), so this sends as few notifications as
# possible: it is opened the first time a pin falls behind and reopened (never a second issue) when one
# falls behind again, its body is edited in place (an edit notifies nobody) only when the report changed,
# and it is closed once everything is current. Never a comment. So a bump that lands closes the issue,
# and one that fails the check leaves it open with the report and a line naming the failed job: that is
# the only time it needs a person. A run that cannot reach upstream does not fail.
#
# A run on any other branch than the default one (workflow_dispatch, to test this workflow) bumps and
# lands on that branch and only prints what it would do to the issue. The schedule always runs on the
# default branch; its event carries no repository object, so github.event.repository.default_branch is
# empty there and cannot be the test on its own (ON_DEFAULT_BRANCH below).
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-check-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Whether this run is on the default branch: the schedule always is (GitHub runs it there); a dispatch is
  # when its branch is the one the dispatch event's repository names as the default.
  ON_DEFAULT_BRANCH: ${{ github.event_name == 'schedule' || (github.event.repository.default_branch != '' && github.ref_name == github.event.repository.default_branch) }}

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      state: ${{ steps.check.outputs.state }}
      report: ${{ steps.check.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A network or API failure, or an upstream that names no version to compare with, is retried,
      # then reported in the run's summary and ends the run without failing it (a failed scheduled
      # run emails) and without touching the issue: a pin that could not be checked is not current.
      - name: Compare the pins with upstream
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          state=unknown
          for attempt in 1 2 3; do
            set +e
            python3 scripts/check_pins.py > report.md
            status=$?
            set -e
            case $status in
              0) state=current; break ;;
              10) state=behind; break ;;
              *) echo "attempt $attempt: upstream could not be checked" >&2; sleep 60 ;;
            esac
          done
          cat report.md
          if [ "$state" = unknown ]; then
            { echo "Upstream could not be checked three times; nothing was changed this week."; echo; cat report.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          { echo "report<<REPORT_END"; cat report.md; echo "REPORT_END"; } >> "$GITHUB_OUTPUT"

  # The only jobs that push (contents: write): this one the bump branch, land the checked bump.
  bump:
    needs: check
    if: needs.check.outputs.state == 'behind'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
      branch: ${{ steps.bump.outputs.branch }}
      summary: ${{ steps.bump.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bump the pins that are behind
        id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/check_pins.py --bump > bump.txt
          status=$?
          set -e
          cat bump.txt
          if [ "$status" = 3 ]; then
            echo "nothing behind any more; nothing to bump"
            exit 0
          fi
          test "$status" = 0
          git diff --stat
          branch="pin-bump"
          [ "$ON_DEFAULT_BRANCH" = true ] || branch="pin-bump-$GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -a -q -F - <<EOF
          Pins: $(paste -sd';' bump.txt | sed 's/;/; /g')

          Bumped by the weekly pin check (scripts/check_pins.py --bump); landed only after the full build
          and check passed on this commit.
          EOF
          git push --force origin "HEAD:refs/heads/$branch"
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "branch=$branch"
            echo "summary=$(paste -sd';' bump.txt | sed 's/;/; /g')"
          } >> "$GITHUB_OUTPUT"

  ci:
    needs: bump
    if: needs.bump.outputs.sha != ''
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}

  # A plain push, never forced: if the branch moved on while the check ran, the push is refused and the
  # bump waits for next week's run, which starts from the new head.
  land:
    needs: [bump, ci]
    if: needs.ci.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 2

      - name: Fast-forward the branch to the checked bump
        env:
          SHA: ${{ needs.bump.outputs.sha }}
          BRANCH: ${{ needs.bump.outputs.branch }}
        run: |
          git push origin "$SHA:refs/heads/$GITHUB_REF_NAME"
          git push origin --delete "$BRANCH"

  # One issue, labelled pin-check, for good: reopened when a pin falls behind again rather than a new one
  # opened, its body edited only when the report changed, closed when all are current.
  issue:
    needs: [check, bump, ci, land]
    if: always() && needs.check.result == 'success' && needs.check.outputs.state != 'unknown'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      # The branch as it is now: after a landed bump, the check runs again on it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: The report after the bump
        id: report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ needs.check.outputs.state }}
          REPORT: ${{ needs.check.outputs.report }}
          BUMP: ${{ needs.bump.result }}
          BUMP_SHA: ${{ needs.bump.outputs.sha }}
          SUMMARY: ${{ needs.bump.outputs.summary }}
          CI: ${{ needs.ci.result }}
          LAND: ${{ needs.land.result }}
        run: |
          printf '%s\n' "$REPORT" > report.md
          state="$STATE"
          if [ "$LAND" = success ]; then
            state=unknown
            for attempt in 1 2 3; do
              set +e
              python3 scripts/check_pins.py > report.md
              status=$?
              set -e
              case $status in
                0) state=current; break ;;
                10) state=behind; break ;;
                *) echo "attempt $attempt: upstream could not be checked" >&2; sleep 60 ;;
              esac
            done
            if [ "$state" = unknown ]; then
              echo "Bumped and landed ${BUMP_SHA:0:7} ($SUMMARY); the check after it could not reach upstream." >> "$GITHUB_STEP_SUMMARY"
            else
              printf '\nLast automatic bump: %s (%s).\n' "$SUMMARY" "${BUMP_SHA:0:7}" >> report.md
            fi
          elif [ "$STATE" = behind ]; then
            # The bump did not land: name what failed, with its run, so the issue says what to look at.
            failed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq '[.jobs[] | select(.conclusion == "failure") | "`\(.name)`" + ([.steps[] | select(.conclusion == "failure") | " at step `\(.name)`"] | first // "") + " (\(.html_url))"] | join("; ")')"
            if [ "$BUMP" = success ] && [ -z "$BUMP_SHA" ]; then
              : # nothing was behind by the time the bump ran
            elif [ -n "$failed" ]; then
              printf '\nThe automatic bump (%s) did not land, %s is unchanged. Failed: %s.\n' "${SUMMARY:-not made}" "$GITHUB_REF_NAME" "$failed" >> report.md
            else
              printf '\nThe automatic bump (%s) did not land, %s is unchanged: bump %s, check %s, land %s (%s).\n' \
                "${SUMMARY:-not made}" "$GITHUB_REF_NAME" "$BUMP" "$CI" "$LAND" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> report.md
            fi
          fi
          cat report.md
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Keep the standing issue up to date
        if: steps.report.outputs.state != 'unknown'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.report.outputs.state }}
          TITLE: "Pinned versions behind upstream"
        run: |
          DRY_RUN=true
          [ "$ON_DEFAULT_BRANCH" != true ] || DRY_RUN=false
          repo="$GITHUB_REPOSITORY"
          act() {
            if [ "$DRY_RUN" = true ]; then
              echo "would run: gh $*" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              gh "$@"
            fi
          }
          if [ "$DRY_RUN" = true ]; then
            { echo "Test run on $GITHUB_REF_NAME: the issue is left alone. Its body would be:"; echo; cat report.md; echo; } >> "$GITHUB_STEP_SUMMARY"
          fi
          act label create pin-check --repo "$repo" --color c5def5 --description "The weekly pin check's standing issue" 2>/dev/null || true
          # Its own assignment, so a failed lookup fails the step (inside the here-string its status is
          # lost, and an empty answer would open a second issue).
          found="$(gh issue list --repo "$repo" --state all --label pin-check --limit 1 \
            --json number,state --jq '.[0] | "\(.number // "") \(.state // "")"')"
          read -r number state <<<"$found"
          if [ "$STATE" = behind ]; then
            if [ -z "$number" ]; then
              act issue create --repo "$repo" --title "$TITLE" --label pin-check --body-file report.md
              exit 0
            fi
            if [ "$(gh issue view "$number" --repo "$repo" --json body --jq .body)" != "$(cat report.md)" ]; then
              act issue edit "$number" --repo "$repo" --body-file report.md
            fi
            if [ "$state" = CLOSED ]; then
              act issue reopen "$number" --repo "$repo"
            fi
          elif [ -n "$number" ] && [ "$state" = OPEN ]; then
            act issue edit "$number" --repo "$repo" --body-file report.md
            act issue close "$number" --repo "$repo"
          else
            echo "every pin is current"
          fi
