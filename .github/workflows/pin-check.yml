name: Pin check

# Weekly: are the pins Dependabot cannot see (the native toolchain, OpenDLSS-NR, appimagetool, the
# AppImage runtime, the Rust toolchain) behind upstream? The answer lives in one standing issue
# (label pin-check), so this sends as few notifications as possible: it is opened the first time a
# pin falls behind and reopened (never a second issue) when one falls behind again, its body is
# edited in place (an edit notifies nobody) only when the report changed, and it is closed once
# everything is current. Never a comment. A run that cannot reach upstream does not fail.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pin-check
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A network or API failure, or an upstream that names no version to compare with, is retried,
      # then reported in the run's summary and ends the run without failing it (a failed scheduled
      # run emails) and without touching the issue: a pin that could not be checked is not current.
      - name: Compare the pins with upstream
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          state=unknown
          for attempt in 1 2 3; do
            set +e
            python3 scripts/check_pins.py > report.md
            status=$?
            set -e
            case $status in
              0) state=current; break ;;
              10) state=behind; break ;;
              *) echo "attempt $attempt: upstream could not be checked" >&2; sleep 60 ;;
            esac
          done
          cat report.md
          if [ "$state" = unknown ]; then
            { echo "Upstream could not be checked three times; nothing was changed this week."; echo; cat report.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"

      # One issue, labelled pin-check, for good: reopened when a pin falls behind again rather than
      # a new one opened, its body edited only when the report changed, closed when all are current.
      - name: Keep the standing issue up to date
        if: steps.check.outputs.state != 'unknown'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.check.outputs.state }}
          TITLE: "Pinned versions behind upstream"
        run: |
          repo="$GITHUB_REPOSITORY"
          gh label create pin-check --repo "$repo" --color c5def5 --description "The weekly pin check's standing issue" 2>/dev/null || true
          read -r number state <<<"$(gh issue list --repo "$repo" --state all --label pin-check --limit 1 \
            --json number,state --jq '.[0] | "\(.number // "") \(.state // "")"')"
          if [ "$STATE" = behind ]; then
            if [ -z "$number" ]; then
              gh issue create --repo "$repo" --title "$TITLE" --label pin-check --body-file report.md
              exit 0
            fi
            if [ "$(gh issue view "$number" --repo "$repo" --json body --jq .body)" != "$(cat report.md)" ]; then
              gh issue edit "$number" --repo "$repo" --body-file report.md
            fi
            if [ "$state" = CLOSED ]; then
              gh issue reopen "$number" --repo "$repo"
            fi
          elif [ -n "$number" ] && [ "$state" = OPEN ]; then
            gh issue edit "$number" --repo "$repo" --body-file report.md
            gh issue close "$number" --repo "$repo"
          else
            echo "every pin is current"
          fi
