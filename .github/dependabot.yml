# Version-update pull requests are off (open-pull-requests-limit: 0 below): the owner's weekly
# maintenance round updates the lockfile and the SHA-pinned actions (new commit SHA, its release in
# the trailing comment) directly, so no update pull requests pile up. Dependabot security updates
# still open pull requests. The rules below are the ones the weekly round follows, and they apply
# again if the limit is raised.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Indirect crates are included: a gtk-rs release has to move its -sys crates with it
    # (gio 0.22.10 does not build against gio-sys 0.22.8), and a direct-only update leaves them
    # behind. Patch and minor updates are grouped separately because Dependabot counts a 0.x
    # bump such as sha2 0.10 -> 0.11 as "minor" although it breaks the API: a breaking bump can
    # only fail the minor group, never the patch one. Major updates each get their own pull request.
    allow:
      - dependency-type: all
    # An ash minor release (0.39 after 0.38) changes its API, and the layer framework's generated
    # hooks (third_party/vk-layer-for-rust) are written against one ash and the Vulkan headers it was
    # generated from: moving is a port and a regeneration, not a version bump. Only patch releases
    # come here.
    ignore:
      - dependency-name: ash
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      cargo-patch:
        patterns:
          - "*"
        update-types:
          - patch
      cargo-minor:
        patterns:
          - "*"
        update-types:
          - minor
