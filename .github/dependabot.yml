# Keeps the workflows' SHA-pinned actions current (one pull request per update, with the new
# commit SHA and its release in the trailing comment) and the lockfile current (two weekly pull
# requests: one for patch-level crate updates, one for minor ones).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Indirect crates are included: a gtk-rs release has to move its -sys crates with it
    # (gio 0.22.10 does not build against gio-sys 0.22.8), and a direct-only update leaves them
    # behind. Patch and minor updates are grouped separately because Dependabot counts a 0.x
    # bump such as sha2 0.10 -> 0.11 as "minor" although it breaks the API: a breaking bump can
    # only fail the minor group, never the patch one. Major updates each get their own pull request.
    allow:
      - dependency-type: all
    # ash 0.38 drops the builder API the layer and the native crate use throughout, and the layer
    # framework (third_party/vk-layer-for-rust) and its generated code are written against ash 0.37:
    # moving needs a port of every Vulkan call site and a regenerated framework, not a version bump.
    # Only its 0.37 patch releases come here.
    ignore:
      - dependency-name: ash
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      cargo-patch:
        patterns:
          - "*"
        update-types:
          - patch
      cargo-minor:
        patterns:
          - "*"
        update-types:
          - minor
