name: Idea or feature request
description: Something Neural Forge could do, or do better
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: 'Search the [open issues](https://github.com/labj1987/neural-forge/issues) first: if the idea is there, add to it instead. English, please.'
- type: textarea
  id: idea
  attributes:
    label: The idea
    description: What you'd like, and what it would let you do.
  validations:
    required: true
- type: dropdown
  id: part
  attributes:
    label: Which part
    options:
    - The model in games
    - The settings app
    - The CLI
    - Setup or install
    - Documentation
  validations:
    required: true
- type: textarea
  id: now
  attributes:
    label: How you do it now
    description: Your current workaround, if any.
  validations:
    required: false
- type: textarea
  id: more
  attributes:
    label: Anything else
    description: Links, examples from other software, screenshots.
  validations:
    required: false
