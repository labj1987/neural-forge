name: Bug report
description: Something in Neural Forge doesn't work as it should
labels:
- bug
body:
- type: markdown
  attributes:
    value: |-
      Thanks for taking the time to report this. Before you start:
      - **Try the [newest release](https://github.com/labj1987/neural-forge/releases/latest) first.** Every release includes the fixes before it, and yours may already be fixed.
      - **Search the [open issues](https://github.com/labj1987/neural-forge/issues).** If yours is there, add your details to it instead.
      - English, please.
      - **Never attach NVIDIA's files**: no `nvngx_dlssnr.dll`, other DLLs or the extracted model folder. Save report leaves them out.
      - Turn the game's own DLSS 5 (Neural Rendering) setting off while Neural Forge runs, or the frame gets both.
- type: input
  id: version
  attributes:
    label: Neural Forge version
    description: Shown in the app's About window, or in the AppImage's file name (`neural-forge-X.Y.Z-x86_64.AppImage`).
    placeholder: 1.2.3
  validations:
    required: true
- type: dropdown
  id: kind
  attributes:
    label: What kind of problem
    options:
    - The model never runs, or the Status tab stays "waiting"
    - Picture problem (flicker, colours, brightness, smearing, artefacts)
    - Crash, freeze or GPU hang (Xid)
    - Low frame rate or stutter
    - The app, the CLI or the install
    - Something else
  validations:
    required: true
- type: textarea
  id: what
  attributes:
    label: What happened
    description: What you saw, what you expected instead, and the steps to get there.
  validations:
    required: true
- type: input
  id: game
  attributes:
    label: Game
    description: The game's name and version (or the date of its last update). `neural-forge-cli games --tested` lists the games Neural Forge is tested in.
    placeholder: GTA V Enhanced, update of 2026-11-04
  validations:
    required: true
- type: dropdown
  id: store
  attributes:
    label: Store and launcher
    options:
    - Steam
    - Steam, in gamescope (Steam Deck, Bazzite, Game Mode)
    - GOG or Epic, through Heroic
    - Lutris or Bottles
    - Something else (say which under "What happened")
  validations:
    required: true
- type: dropdown
  id: neural-forge-proton
  attributes:
    label: The game is set to the Neural Forge Proton (Status tab shows it)
    description: The game's Properties > Compatibility in Steam names the Proton it runs with; Neural Forge's own end in "-NeuralForge". The Status tab says so while the game runs ("isn't on the Neural Forge Proton" when it is not), and Save report lists every game's.
    options:
    - Yes, a -NeuralForge Proton
    - No (another Proton, or the game is not on Steam)
    - I don't know
  validations:
    required: true
- type: checkboxes
  id: dlss
  attributes:
    label: DLSS features on in the game
    description: Tick every one the game has switched on while the problem shows.
    options:
    - label: Super Resolution (an upscaling mode)
    - label: DLAA (Super Resolution at native resolution)
    - label: Ray Reconstruction
    - label: Frame Generation (with the multiplier under "What happened" if it has one)
    - label: The game's own DLSS 5 Neural Rendering (turn it off for Neural Forge)
- type: input
  id: placement
  attributes:
    label: Model placement
    description: The **Model placement** line on the Status tab while the problem shows (and the **Tested game** line under it, if the game is a tested one).
    placeholder: before the upscaler, 1708x960
  validations:
    required: true
- type: input
  id: hdr
  attributes:
    label: HDR
    description: The **HDR** line on the Status tab while the game runs (or `hdr_verdict=` from `neural-forge-cli shmctl status`), and whether the game's own HDR setting is on.
    placeholder: 'game outputs HDR10 (...); desktop: GNOME: DP-1 HDR on. The game''s HDR setting is on.'
  validations:
    required: true
- type: dropdown
  id: often
  attributes:
    label: How often
    options:
    - Every time
    - Sometimes
    - Once so far
  validations:
    required: true
- type: input
  id: gpu
  attributes:
    label: Graphics card and NVIDIA driver version
    placeholder: RTX 5070 12 GB, NVIDIA 620.70.06
  validations:
    required: true
- type: input
  id: proton
  attributes:
    label: Proton version and how the game starts
    description: Proton build, and gamescope, HDR or anything else in the launch options.
    placeholder: Proton Experimental 11.0-20261027b, no gamescope
  validations:
    required: true
- type: input
  id: system
  attributes:
    label: Distribution, kernel and desktop
    description: For example from `uname -r` and your desktop's About page.
    placeholder: Ubuntu 26.04, kernel 7.3.0, GNOME Wayland
  validations:
    required: true
- type: textarea
  id: settings
  attributes:
    label: Settings you changed
    description: Network, placement, model resolution, colour settings or environment variables you set. Leave empty if none.
  validations:
    required: false
- type: dropdown
  id: others
  attributes:
    label: Other software hooked into the game
    options:
    - No, nothing else
    - Yes (named under "Settings you changed")
    description: MangoHud, vkBasalt, ReShade, OptiScaler, other DLSS 5 tools and overlays change what Neural Forge sees. Please also try without them.
  validations:
    required: true
- type: textarea
  id: report
  attributes:
    label: Save report zip
    description: Press **Save report** on the Status tab (or run `neural-forge-cli report`) right after the problem, with the game still running if you can, and drag the zip from your desktop here. It holds the layer's log, the live status, your settings, the game's entry in the tested games and the HDR verdict; personal names are removed and it has no NVIDIA files in it. If you were asked for a trace, add it with `neural-forge-cli report --trace FILE`.
  validations:
    required: true
- type: textarea
  id: log
  attributes:
    label: Layer log (optional)
    description: 'For problems in a game: add `NEURAL_FORGE_LOG=/tmp/nf.log` to the game''s launch options, reproduce it, and attach `/tmp/nf.log`.'
  validations:
    required: false
- type: textarea
  id: media
  attributes:
    label: Screenshots or video
    description: A short video helps most with picture problems.
  validations:
    required: false
- type: checkboxes
  id: checks
  attributes:
    label: Before you send it
    options:
    - label: I'm on the newest release, or the problem is still there on it.
      required: true
    - label: I searched the open issues for this problem.
      required: true
    - label: I'm not attaching nvngx_dlssnr.dll, other NVIDIA files or the extracted model.
      required: true
