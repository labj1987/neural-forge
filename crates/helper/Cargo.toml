[package]
name = "neural-forge-helper"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Windows-side NGX service: owns the DLSS 5 Neural Rendering model, runs under Wine/Proton"

[lib]
name = "neural_forge_helper"
path = "src/lib.rs"

[[bin]]
name = "neural-forge-helper"
path = "src/main.rs"

[build-dependencies]
# Compiles csrc/guard_shim.c, the setjmp site `guard.rs` needs (see that file).
cc = "1"

[dependencies]
neural-forge-protocol = { path = "../protocol" }
# Same exact version as neural-forge-layer, for the same reason: ash's own types (vk::Device,
# vk::Instance, ...) have to be the identical crate instance/version wherever this
# helper and the layer's SHM/dma-buf contract need to agree on a Vulkan type shape.
ash = "=0.37.3"

# Deliberately no `windows`/`windows-sys` dependency: every WinAPI call this crate
# makes (LoadLibraryExW, GetProcAddress, VirtualProtect, AddVectoredExceptionHandler,
# ...) is declared directly against kernel32.dll via `extern "system"` blocks instead.
# These are among the oldest, most stable parts of the Win32 ABI, and declaring them
# directly means this crate's correctness never depends on how some wrapper crate
# happens to shape its own bindings for them -- worth the small amount of boilerplate
# given nothing here can be compiler-checked on this dev machine yet (see CLAUDE.md).
