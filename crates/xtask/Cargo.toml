[package]
name = "xtask"
description = "The repository's development tasks (release notes, appdata, licence listing, pin and shader checks, benchmark reports): `cargo xtask <task>`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2"
png = "0.18"
roxmltree = "0.21"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
similar = "3"

[lints]
workspace = true
