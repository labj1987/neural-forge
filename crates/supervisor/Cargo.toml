[package]
name = "neural-forge-supervisor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Shared config, paths, model extraction and install for neural-forge-cli and neural-forge"

[dependencies]
neural-forge-protocol = { path = "../protocol" }
# install.rs's file-integrity digest and installation.json record must produce
# exactly what scripts/install.py's own hashlib.sha256/json.dumps do (both tools
# read/write the same record, on purpose) -- worth a real, audited implementation
# rather than hand-rolling either, unlike config.ini's own small flat-format parser.
sha2 = "0.11"
serde_json = "1"
