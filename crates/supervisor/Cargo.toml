[package]
name = "neural-forge-supervisor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Shared helper-process supervision (config, paths, start/stop) for neural-forge-cli and neuralforge"

[dependencies]
neural-forge-protocol = { path = "../protocol" }
libc = "0.2"
# Process-group supervision (setsid, signaling a whole group) -- see process.rs's
# doc comment for why this needed care to actually replicate upstream's bash script's
# `setsid ...` / `kill -TERM -- -$pid` semantics.
nix = { version = "0.29", features = ["process", "signal"] }
# install.rs's file-integrity digest and installation.json record must produce
# exactly what scripts/install.py's own hashlib.sha256/json.dumps do (both tools
# read/write the same record, on purpose) -- worth a real, audited implementation
# rather than hand-rolling either, unlike config.ini's own small flat-format parser.
sha2 = "0.10"
serde_json = "1"
