[package]
name = "neural-forge-supervisor"
version.workspace = true
publish.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared config, paths, model extraction and install for neural-forge-cli and neural-forge"

[lints]
workspace = true

[dependencies]
neural-forge-protocol = { path = "../protocol" }
# install.rs's file-integrity digest, recorded in installation.json: worth a real, audited
# implementation rather than a hand-rolled one, unlike config.ini's own small flat-format parser.
sha2 = "0.11"
serde_json = "1"
# The diagnostic report's zip (`report::zip`) deflates its text members. Already linked through
# `png`, so this adds no crate.
miniz_oxide = "0.9"
# The doctor's writability check (access) and the report's local time (localtime_r).
libc = "0.2"

# The pre-release game sweep (cargo xtask game-sweep): its unit tests run with `cargo test`.
[[example]]
name = "game-sweep"
path = "examples/game_sweep.rs"
test = true
