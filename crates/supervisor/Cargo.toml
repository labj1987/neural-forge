[package]
name = "neural-forge-supervisor"
version.workspace = true
publish.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared config, paths, model extraction and install for neural-forge-cli and neural-forge"

[lints]
workspace = true

[dependencies]
neural-forge-protocol = { path = "../protocol" }
# install.rs's file-integrity digest and installation.json record must produce
# exactly what scripts/install.py's own hashlib.sha256/json.dumps do (both tools
# read/write the same record, on purpose) -- worth a real, audited implementation
# rather than hand-rolling either, unlike config.ini's own small flat-format parser.
sha2 = "0.11"
serde_json = "1"
# The diagnostic report's zip (`report::zip`) deflates its text members. Already linked through
# `png`, so this adds no crate.
miniz_oxide = "0.9"
# The doctor's writability check (access) and the report's local time (localtime_r).
libc = "0.2"
# `ngx_audit`: the NGX core's export and import tables (already linked through `backtrace`), and the decoder its
# scan of the core's code runs on.
object = { version = "0.40", default-features = false, features = ["read_core", "pe", "std"] }
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder", "instr_info"] }

[dev-dependencies]
# The scan's tests assemble their x86-64 code.
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder", "instr_info", "code_asm"] }

# The pre-release game sweep (scripts/game-sweep.sh): its unit tests run with `cargo test`.
[[example]]
name = "game-sweep"
path = "examples/game_sweep.rs"
test = true
