# Modified for Neural Forge (2026): only the codegen binary and its dependencies (UPSTREAM.md).

[package]
edition = "2021"
name = "vulkan-layer-scripts"
version = "0.1.0"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bindgen = "0.73.2"
clap = { version = "4.5.8", features = ["derive"] }
env_logger = "0.11.3"
imara-diff = "0.2.0"
log = "0.4.22"
tempfile = "3.10.1"

[[bin]]
name = "codegen"
path = "codegen.rs"
