[package]
edition = "2021"
name = "vulkan-layer-macros"
version = "0.1.0"
publish = false
license = "Apache-2.0"
repository = "https://github.com/google/vk-layer-for-rust"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.69"
quote = "1.0.36"
syn = { version = "3.0.9", features = ["full"] }

[dev-dependencies]
ash = "0.38.0"
once_cell = "1.17.1"
vulkan-layer = { path = "../vulkan-layer" }
