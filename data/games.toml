# Neural Forge's per-game compatibility facts: what each tested game uses, where the model runs in it and
# what to know first. Built into the app (the Status tab, `neural-forge-cli games`, `doctor` and Save report
# read it) and used by the pre-release sweep (`scripts/game-sweep.sh`, scripts/game-sweep.toml) as what to
# expect. docs/USER_GUIDE.md's "Tested games" table says the same in prose.
#
# One [[game]] table per game:
#   name          the game's name as its store shows it
#   steam_appid   its Steam app id (omit for a game outside Steam)
#   exe           the executables Neural Forge targets (NEURAL_FORGE_TARGET_EXE)
#   engine, api   the engine and the graphics API it runs on under Proton (DX11, DX12, Vulkan)
#   dlss          the DLSS features it was run with
#   placement     where the model runs with the default Placement (Auto), Ray Reconstruction off:
#                 "before" (before the upscaler, in front of DLSS's command buffer), "before-inside" (before the
#                 upscaler, inside DLSS's command buffer), "after-dlss" (on DLSS's output, before the HUD) or
#                 "finished-frame" (on the presented frame)
#   placement_rr  the same with DLSS Ray Reconstruction on (omit when the game has none)
#   hdr           "hdr10" (the game can present HDR10), "none" (SDR only) or "unknown"
#   hdr_route     how HDR reaches the screen under Proton (omit for "none")
#   notes         setup steps and known issues, one sentence each
#   verified, verified_on  the Neural Forge version and the date it was last seen working in (omit when not
#                 recorded: the game was tested before this list began)
#   verified_by   who ran it: "test machine" (the project's RTX 5070) or "user report (#issue)"

[[game]]
name = "GTA V Enhanced"
steam_appid = 3240220
exe = ["PlayGTAV.exe", "GTA5_Enhanced.exe", "GTA5_Enhanced_BE.exe"]
engine = "RAGE"
api = "DX12"
dlss = "Super Resolution, Frame Generation 4x"
placement = "before"
hdr = "none"
notes = []
verified = "4.1.2"
verified_on = "2026-11-12"
verified_by = "test machine"

[[game]]
name = "Crimson Desert"
steam_appid = 3321460
exe = ["CrimsonDesert.exe", "pers.exe"]
engine = "BlackSpace"
api = "DX12"
dlss = "Ray Reconstruction, dynamic Frame Generation"
placement = "before-inside"
placement_rr = "after-dlss"
hdr = "hdr10"
hdr_route = "The game's HDR setting, with PROTON_ENABLE_WAYLAND=1 PROTON_ENABLE_HDR=1 in its launch options (Proton-GE) or in gamescope with HDR on."
notes = ["It compiles shaders on its first launch after a Neural Forge update; the effect starts once it is in the world."]
verified = "3.14.0"
verified_on = "2026-11-10"
verified_by = "test machine"

